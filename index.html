<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Planificador de Tareas: organiza y da seguimiento a tus tareas.">
  <title>Planificador de Tareas</title>

  <!-- Bootstrap 5 (CDN) -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous">
  <!-- Bootstrap Icons y fuente Inter -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Estilos propios -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!------------------- Ventana del organizador ----------------------->
  <div class="ventana">

    <!------------------- Navbar ----------------------->
    <header class="barra-nav">
      <a class="logo" href="index.html">Logo - firma</a>

      <ul class="nav nav-pills nav-pildora" id="menuVistas" role="tablist">
        <li class="nav-item" role="presentation">
          <button class="nav-link" id="tabHome" data-bs-toggle="pill" data-bs-target="#vistaHome" type="button"
            role="tab" aria-controls="vistaHome" aria-selected="false">Home</button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link active" id="tabTareas" data-bs-toggle="pill" data-bs-target="#vistaTareas" type="button"
            role="tab" aria-controls="vistaTareas" aria-selected="true">Tareas</button>
        </li>
      </ul>

      <button class="btn-perfil" type="button" aria-label="Perfil">
        <i class="bi bi-person"></i>
      </button>
    </header>

    <!------------------- Contenido (cambia con el navbar) ----------------------->
    <main class="tab-content contenido">

      <!------------------- Sección Home ----------------------->
      <section class="tab-pane fade vista" id="vistaHome" role="tabpanel" aria-labelledby="tabHome" tabindex="0">

        <div class="columna columna-izq">
        </div>

        <div class="columna columna-der">
        </div>
      </section>

      <!------------------- Sección Tareas ----------------------->
      <section class="tab-pane fade show active vista" id="vistaTareas" role="tabpanel" aria-labelledby="tabTareas" tabindex="0">
        <!------------------- Formulario ----------------------->
        <form class="panel panel-formulario" id="formTarea">
          <h2 class="titulo-panel">Nueva tarea</h2>

          <div class="grupo-campo">
            <label for="nombreTarea" class="form-label">Nombre</label>
            <input type="text" class="form-control" id="nombreTarea" name="nombreTarea" placeholder="Nombre de la tarea">
          </div>

          <div class="grupo-campo">
            <label for="descripcionTarea" class="form-label">Descripción</label>
            <textarea class="form-control" id="descripcionTarea" name="descripcionTarea" rows="3"
              placeholder="Descripción de la tarea"></textarea>
          </div>

          <div class="grupo-campo">
            <label for="fechaEntrega" class="form-label">Fecha de entrega</label>
            <input type="date" class="form-control" id="fechaEntrega" name="fechaEntrega">
          </div>

          <div class="grupo-campo">
            <label for="estadoTarea" class="form-label">Estado</label>
            <select class="form-select" id="estadoTarea" name="estadoTarea">
              <option value="" selected disabled>Selecciona un estado</option>
              <option value="pendiente">Pendiente</option>
              <option value="en-proceso">En proceso</option>
              <option value="completada">Completada</option>
            </select>
          </div>

          <div class="botones-form">
            <button type="submit" class="btn btn-agregar">Agregar tarea</button>
            <button type="reset" class="btn btn-limpiar">Limpiar</button>
          </div>
        </form>
      </section>

    </main>
  </div>

  <!-- Bootstrap JS (CDN) -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>

  <!-- Lógica propia -->
  <script src="js/script.js" defer></script>
</body>
</html>
